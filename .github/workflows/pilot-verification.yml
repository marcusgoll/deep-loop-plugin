name: Pilot verification
on:
  pull_request:
    branches: [master, codex/pilot-admission, codex/pilot-auth-recovery]
  push:
    branches: [codex/pilot-admission]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify pilot behavior
        run: python -m unittest discover -s pilot -p 'test_*.py'
